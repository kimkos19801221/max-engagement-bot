name: max-engagement-bot

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-engagement-bot-worker
    restart: unless-stopped
    env_file:
      - path: .env.timeweb
        required: false
    networks:
      - max-engagement-bot-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-engagement-bot-web
    restart: unless-stopped
    command: npm run web
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 4317
    env_file:
      - path: .env.timeweb
        required: false
    expose:
      - "4317"
    networks:
      - max-engagement-bot-net

networks:
  max-engagement-bot-net:
    name: max-engagement-bot-net
