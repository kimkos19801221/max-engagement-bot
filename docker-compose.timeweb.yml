name: max-engagement-bot

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-engagement-bot-worker
    restart: unless-stopped
    command: npm run max:watch
    environment:
      ENGAGEMENT_STORAGE: supabase
      MAX_API_MODE: http
      NODE_ENV: production
    env_file:
      - path: .env.timeweb
        required: false
    networks:
      - max-engagement-bot-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-engagement-bot-web
    restart: unless-stopped
    command: npm run web
    environment:
      ENGAGEMENT_STORAGE: supabase
      MAX_API_MODE: http
      NODE_ENV: production
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 4317
    env_file:
      - path: .env.timeweb
        required: false
    expose:
      - "4317"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4317/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - max-engagement-bot-net

networks:
  max-engagement-bot-net:
    name: max-engagement-bot-net
